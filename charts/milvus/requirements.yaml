dependencies:
- name: etcd
  version: 8.12.0
  repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
  condition: etcd.enabled
  tags:
    - etcd
- name: silo
  version: 7.0.2
  # fix as silo doesn't have a helm repository
  repository: file://../silo/
  condition: silo.enabled
  tags:
    - silo
- name: pulsarv2
  alias: pulsar
  version: 2.7.8
  repository: https://zilliztech.github.io/milvus-helm
  condition: pulsar.enabled
  tags:
    - pulsar
- name: pulsar
  alias: pulsarv3
  version: 3.3.0
  repository: https://pulsar.apache.org/charts
  condition: pulsarv3.enabled
  tags:
    - pulsarv3
- name: kafka
  version: 15.5.1
  repository: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
  condition: kafka.enabled
  tags:
    - kafka
- name: tei
  version: 1.6.0
  repository: https://zilliztech.github.io/milvus-helm
  condition: tei.enabled
  tags:
    - tei
